<body>
  <div class="container">
    <!-- 標題區 -->
    <header class="header" role="banner">
      <div class="header-content">
        <div class="header-left">
          <img src="logo.jpg" alt="FLB Logo" class="header-logo" width="48" height="48">
          <div>
            <h1>FLB學習歷程</h1>
            <div class="date" id="currentDate" aria-live="polite">載入中...</div>
          </div>
        </div>
      </div>
    </header>

    <!-- 導航按鈕 -->
    <div class="nav-buttons">
      <button class="nav-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> 返回行事曆
      </button>
      <button class="nav-btn" onclick="openHistory()">
        <i class="fas fa-history"></i> 查看歷史記錄
      </button>
      <button class="nav-btn" onclick="refreshCourses()">
        <i class="fas fa-sync-alt"></i> 重新整理
      </button>
      <button class="nav-btn" onclick="openCommentTemplatesPanel()">
        <i class="fas fa-quote-right"></i> 評語模板
      </button>
      <button class="nav-btn" onclick="openVideoTemplatesPanel()">
        <i class="fas fa-film"></i> 影片模板
      </button>
    </div>

    <!-- 視圖：課程選擇 -->
    <main id="view-select" class="glass-card course-selector" role="main">
      <h2 style="color: white; margin-bottom: 15px;">
        <i class="fas fa-chalkboard-teacher"></i> 待上傳的已結束課程
      </h2>
      <!-- 🗓️ 快速星期篩選：一二三四五六日（與行事曆一致風格） -->
      <div id="weekdayFilterBar" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
        <style>
          /* 📅 星期快速篩選按鈕（輕量樣式） */
          .wd-btn {
            background: rgba(255, 255, 255, .9);
            border: 1px solid rgba(59, 130, 246, .25);
            color: #0f172a;
            font-weight: 800;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 13px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, .12);
          }

          .wd-btn.active {
            background: rgba(16, 185, 129, .12);
            border-color: rgba(16, 185, 129, .45);
            color: #065f46;
            box-shadow: 0 6px 16px rgba(16, 185, 129, .18);
          }
        </style>
        <button type="button" class="wd-btn" data-wd="1">一</button>
        <button type="button" class="wd-btn" data-wd="2">二</button>
        <button type="button" class="wd-btn" data-wd="3">三</button>
        <button type="button" class="wd-btn" data-wd="4">四</button>
        <button type="button" class="wd-btn" data-wd="5">五</button>
        <button type="button" class="wd-btn" data-wd="6">六</button>
        <button type="button" class="wd-btn" data-wd="7">日</button>
      </div>
      <div class="course-toolbar">
        <div class="toolbar-left">
          <div class="filter-group">
            <label for="rangeFilter"><i class="fas fa-calendar-check"></i> 範圍：</label>
            <select id="rangeFilter" class="filter-select">
              <option value="today">今日已結束</option>
              <option value="week">本週課程</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="datePicker"><i class="fas fa-calendar-day"></i> 日期：</label>
            <input id="datePicker" type="date" class="filter-select" />
          </div>
          <div class="filter-group">
            <label for="statusFilter"><i class="fas fa-tasks"></i> 狀態：</label>
            <select id="statusFilter" class="filter-select">
              <option value="all">全部</option>
              <option value="completed">已結束</option>
              <option value="upcoming">尚未開始</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="instructorFilter"><i class="fas fa-chalkboard-teacher"></i> 講師：</label>
            <select id="instructorFilter" class="filter-select">
              <option value="">全部講師</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="courseTypeFilter"><i class="fas fa-layer-group"></i> 類別：</label>
            <select id="courseTypeFilter" class="filter-select">
              <option value="">全部類別</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="studentSearch"><i class="fas fa-user"></i> 學生：</label>
            <input id="studentSearch" class="filter-select" placeholder="輸入學生姓名" />
          </div>
        </div>
        <div class="toolbar-right">
          <div class="summary-chip" id="courseSummary">
            <i class="fas fa-info-circle"></i>
            <span>載入中...</span>
          </div>
        </div>
      </div>
      <div class="filter-meta" id="courseMeta"></div>
      <section class="course-list" id="courseList" aria-label="課程列表" aria-live="polite">
        <!-- 課程列表將動態載入 -->
      </section>
    </main>

    <!-- 視圖：學生個別上傳 -->
    <section class="students-section" id="studentsSection" aria-label="學生學習記錄上傳">
      <div id="topTabsSentinel"></div>
      <!-- 頂部學生籤列（Mobile） -->
      <div id="topTabs" class="lr-top-tabs" style="display: none;"></div>
      <div class="glass-card" id="studentCardPanel">
        <!-- 模式切換（置於學生卡片上方，手機更容易點到） -->
        <div id="modeSwitchBar" class="mode-switch-bar">
          <style>
            #modeSwitchBar .nav-btn,
            #modeSwitchBarOv .nav-btn {
              position: relative;
              overflow: visible;
              padding-right: 56px;
              padding-bottom: 28px;
            }

            #modeSwitchBar .mode-switch-inner,
            #modeSwitchBarOv .mode-switch-inner {
              align-items: flex-end;
            }

            .capbar {
              position: absolute;
              left: 10px;
              right: 10px;
              bottom: 8px;
              height: 6px;
              border-radius: 999px;
              background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .25));
              box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06);
            }

            .capbar .fill {
              position: absolute;
              left: 0;
              top: 0;
              bottom: 0;
              width: 0;
              background: linear-gradient(90deg, #7dd3fc, #60a5fa);
              border-radius: 999px;
              transition: width .45s cubic-bezier(.22, .61, .36, 1);
              overflow: hidden;
              filter: drop-shadow(0 0 6px rgba(96, 165, 250, .45));
            }

            .capbar .fill::after {
              content: '';
              position: absolute;
              inset: 0;
              background: linear-gradient(90deg, rgba(255, 255, 255, .00) 0%, rgba(255, 255, 255, .45) 30%, rgba(255, 255, 255, .00) 60%);
              transform: translateX(-100%);
              animation: capflow 2.2s linear infinite
            }

            @keyframes capflow {
              to {
                transform: translateX(100%);
              }
            }

            .capbar .fill.done {
              background: linear-gradient(90deg, #34d399, #10b981);
              filter: drop-shadow(0 0 8px rgba(16, 185, 129, .45));
              animation: capdone .6s ease both;
            }

            @keyframes capdone {
              0% {
                transform: scaleX(.96)
              }

              60% {
                transform: scaleX(1.02)
              }

              100% {
                transform: scaleX(1)
              }
            }

            /* 浮動標籤：顯示於膠囊下方 */
            .capbar .pct {
              position: absolute;
              bottom: -22px;
              left: 50%;
              transform: translateX(-50%);
              font-weight: 700;
              color: #0f172a;
              font-size: 11px;
              padding: 3px 12px;
              border-radius: 999px;
              background: rgba(255, 255, 255, .96);
              border: 1px solid rgba(148, 163, 184, .35);
              box-shadow: 0 6px 14px rgba(15, 23, 42, .12);
              white-space: nowrap;
              pointer-events: none;
              letter-spacing: 0.2px;
            }

            .capbar .pct.done {
              color: #0f766e;
              border-color: rgba(16, 185, 129, .35);
              box-shadow: 0 6px 16px rgba(16, 185, 129, .18);
            }

            #overviewSyncStatus .capbar {
              bottom: 4px;
            }

            #overviewSyncStatus .capbar .pct {
              display: none;
            }
          </style>
          <div class="mode-switch-inner">
            <button class="nav-btn" id="btnStudentMode">
              <i class="fas fa-users"></i> 學生模式
              <span class="capbar"><span class="fill" id="studentModeProgressFill"></span><span class="pct"
                  id="studentModeProgressText">0%</span></span>
            </button>
            <button class="nav-btn" id="btnOverviewMode">
              <i class="fas fa-clipboard-list"></i> 課程總覽
              <span class="capbar"><span class="fill" id="overviewModeProgressFill"></span><span class="pct"
                  id="overviewModeProgressText">0%</span></span>
            </button>
          </div>
        </div>
        <div class="students-grid" id="studentsGrid"><!-- 學生卡片將動態載入 --></div>
      </div>

      <!-- 桌面：左側學生清單（僅桌面顯示） -->
      <div class="glass-card desktop-student-list" id="desktopStudentList" style="display:none;"></div>

      <!-- 已上傳記錄（改用 FAB 抽屜，主區塊在手機隱藏） -->
      <div class="glass-card" style="margin-top: 16px; display: none;">
        <h2 style="color: white; margin-bottom: 20px;">
          <i class="fas fa-folder-open"></i> 已上傳記錄
        </h2>
        <div id="uploadedRecordsSection" style="background: white; border-radius: 12px; padding: 16px;">
          <div class="empty-state"><i class="fas fa-info-circle"></i> 尚未選擇課程</div>
        </div>
      </div>

      <!-- 視圖：課程總覽 -->
      <section class="glass-card overview-section" id="view-overview" aria-label="課程總覽">
        <!-- 模式切換（課程總覽也顯示） -->
        <div id="modeSwitchBarOv" class="mode-switch-bar">
          <div class="mode-switch-inner">
            <button class="nav-btn" id="btnStudentMode2">
              <i class="fas fa-users"></i> 學生模式
              <span class="capbar"><span class="fill" id="studentModeProgressFill"></span><span class="pct"
                  id="studentModeProgressText">0%</span></span>
            </button>
            <button class="nav-btn" id="btnOverviewMode2">
              <i class="fas fa-clipboard-list"></i> 課程總覽
              <span class="capbar"><span class="fill" id="overviewModeProgressFill"></span><span class="pct"
                  id="overviewModeProgressText">0%</span></span>
            </button>
          </div>
        </div>
        <h2 style="color: white; margin-bottom: 20px;">
          <i class="fas fa-clipboard-list"></i> 課程總覽
        </h2>
        <div style="background: white; border-radius: 15px; padding: 20px;">
          <div class="upload-area">
            <label class="upload-label">📸🎬 課程照片與影片（可多檔）</label>
            <div id="overviewCourseTitle"
              style="margin:6px 0 12px; font-weight:800; font-size:15px; color:#1d4ed8; letter-spacing:0.4px;"></div>

            <!-- 🔥 進度顯示面板（分批處理時顯示） -->
            <div id="overviewUploadProgress" class="upload-progress-panel"
              style="display:none; margin-bottom:12px; padding:12px; background:#f0f9ff; border:1px solid #bfdbfe; border-radius:10px;">
              <div class="progress-header"
                style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span class="progress-title" style="font-weight:700; color:#1e40af; font-size:13px;">
                  <i class="fas fa-sync fa-spin"></i> 處理中...
                </span>
                <span class="progress-stats" style="font-weight:600; color:#3b82f6; font-size:12px;"
                  id="overviewProgressStats">0 / 0</span>
              </div>
              <div class="progress-bar" style="height:8px; background:#e0e7ff; border-radius:999px; overflow:hidden;">
                <div class="progress-fill" id="overviewProgressFill"
                  style="height:100%; width:0%; background:linear-gradient(90deg, #60a5fa, #3b82f6); transition:width 0.3s ease; border-radius:999px;">
                </div>
              </div>
              <div class="progress-details"
                style="display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#64748b;">
                <span class="current-step" id="overviewProgressStep">準備中</span>
                <span class="eta" id="overviewProgressEta">預估剩餘: --</span>
              </div>
            </div>

            <div class="file-drop-zone" id="overviewPhotosDropZone">
              <i class="fas fa-images"></i>
              <div class="text">點擊或拖放照片/影片</div>
            </div>
            <input type="file" id="overviewPhotosInput" class="file-input" accept="image/*,video/*" multiple>
            <div class="file-previews" id="overviewPhotosPreviews"></div>
            <!-- 影片：改為獨立區塊，與學生頁一致 -->

            <div class="upload-area" style="margin-top:8px">
              <label class="upload-label">🗂️ 已上傳（課程總覽）</label>
              <div class="file-previews" id="overviewExistingPreviews"></div>
            </div>
          </div>

          <div class="upload-area">
