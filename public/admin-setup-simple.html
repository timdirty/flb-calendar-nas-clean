<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速設定管理員</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .admin-id {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            margin: 20px 0;
            word-break: break-all;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 快速設定管理員</h1>
        <p>點擊下方按鈕即可設定管理員</p>
        
        <div class="admin-id">
            <strong>管理員 ID:</strong><br>
            Udb51363eb6fdc605a6a9816379a38103
        </div>

        <button onclick="setAdmin()" id="setBtn">
            💾 設定管理員
        </button>
        
        <button onclick="checkAdmin()" id="checkBtn">
            🔍 檢查當前管理員
        button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function showStatus(message, type) {
            var statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            statusEl.style.display = 'block';
        }

        function setAdmin() {
            var btn = document.getElementById('setBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 設定中...';
            
            var adminUserId = 'Udb51363eb6fdc605a6a9816379a38103';
            
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/admin/set', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            
            xhr.onload = function() {
                btn.disabled = false;
                btn.innerHTML = '💾 設定管理員';
                
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.success) {
                            showStatus('✅ 管理員設定成功！', 'success');
                            console.log('設定成功:', data);
                        } else {
                            showStatus('❌ 設定失敗: ' + (data.message || '未知錯誤'), 'error');
                            console.error('設定失敗:', data);
                        }
                    } catch (e) {
                        showStatus('❌ 解析回應失敗', 'error');
                        console.error('解析錯誤:', e, xhr.responseText);
                    }
                } else {
                    showStatus('❌ 請求失敗 (狀態碼: ' + xhr.status + ')', 'error');
                    console.error('請求失敗:', xhr.status, xhr.statusText);
                }
            };
            
            xhr.onerror = function() {
                btn.disabled = false;
                btn.innerHTML = '💾 設定管理員';
                showStatus('❌ 網路錯誤', 'error');
                console.error('網路錯誤');
            };
            
            xhr.send(JSON.stringify({
                adminUserId: adminUserId
            }));
        }

        function checkAdmin() {
            var btn = document.getElementById('checkBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 檢查中...';
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/admin/info', true);
            
            xhr.onload = function() {
                btn.disabled = false;
                btn.innerHTML = '🔍 檢查當前管理員';
                
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.success && data.data && data.data.userId) {
                            var adminInfo = data.data.name && data.data.name !== '未知' 
                                ? data.data.name + ' (' + data.data.userId + ')'
                                : data.data.userId;
                            showStatus('✅ 當前管理員: ' + adminInfo, 'success');
                            console.log('管理員資訊:', data);
                        } else {
                            showStatus('⚠️ 尚未設定管理員', 'info');
                            console.log('未設定:', data);
                        }
                    } catch (e) {
                        showStatus('❌ 解析回應失敗', 'error');
                        console.error('解析錯誤:', e);
                    }
                } else {
                    showStatus('❌ 檢查失敗 (狀態碼: ' + xhr.status + ')', 'error');
                    console.error('檢查失敗:', xhr.status);
                }
            };
            
            xhr.onerror = function() {
                btn.disabled = false;
                btn.innerHTML = '🔍 檢查當前管理員';
                showStatus('❌ 網路錯誤', 'error');
            };
            
            xhr.send();
        }

        // 頁面載入時自動檢查
        window.onload = function() {
            checkAdmin();
        };
    </script>
</body>
</html>
